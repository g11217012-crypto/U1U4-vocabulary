<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>單字小偵探｜Unit 1 & Unit 4</title><style>
:root{--bg:#faf7ee;--paper:#fffefa;--ink:#304f47;--green:#3e6d59;--muted:#738075;--line:#dce1d3;--gold:#ddb153}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}header{max-width:980px;margin:auto;padding:26px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-weight:850;font-size:23px}.small{font-size:13px;color:var(--muted);line-height:1.7}main{max-width:920px;margin:10px auto;padding:0 18px 30px}.hero{text-align:center;padding:22px 5px}.eyebrow{letter-spacing:3px;font-size:12px;color:var(--muted);font-weight:750}h1{font-size:clamp(32px,6vw,46px);margin:18px 0 12px}h2{font-size:26px}.muted{color:var(--muted);line-height:1.9}.panel{background:var(--paper);border:1px solid var(--line);border-radius:25px;padding:30px;box-shadow:0 15px 40px #304f4705}button,input{font:inherit}button{min-height:50px;padding:13px 19px;border:1px solid var(--line);border-radius:13px;color:var(--ink);background:white;cursor:pointer;touch-action:manipulation;font-weight:650}button:hover{border-color:var(--green);background:#eef3e7}button:disabled{opacity:.45;cursor:default}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#315440}button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:24px 0}.choice{text-align:left;min-height:150px;display:flex;flex-direction:column;gap:12px;padding:22px}.choice b{font-size:24px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.badge{border-radius:20px;background:#e9efdf;padding:8px 13px;font-size:14px}.track{height:8px;background:#e8eade;border-radius:10px;margin:22px 0}.bar{height:100%;border-radius:10px;background:var(--green)}.clue{font-size:clamp(23px,4vw,31px);line-height:1.9;margin:25px 0 18px;font-weight:550}.answerline{font-size:22px;line-height:2.3;margin:15px 0}input{width:min(100%,420px);min-height:60px;border:2px solid #c8d4bc;border-radius:12px;background:#fcfdf8;padding:10px 15px;color:var(--ink);font-size:25px;vertical-align:middle}input:disabled{color:var(--green);opacity:1;background:#edf3e5}.feedback{padding:15px 18px;background:#f2f1e7;border-radius:13px;line-height:1.8;min-height:60px;font-weight:650}.hint{margin:16px 0;min-height:25px;line-height:1.8;color:#826b42}.wordbank{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.wordbank span{border:1px solid var(--line);padding:8px 12px;border-radius:10px;background:white}.results{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:25px 0}.stat{background:#eef2e6;padding:20px;border-radius:15px;min-width:140px}.stat b{display:block;font-size:35px}table{border-collapse:collapse;width:100%;font-size:16px;line-height:1.7}td,th{padding:13px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}details{margin-top:25px}summary{cursor:pointer;font-weight:700;padding:10px 0}.tablewrap{overflow:auto}.center{text-align:center}footer{text-align:center;padding:22px;color:var(--muted);font-size:13px}@media(max-width:650px){.choices{grid-template-columns:1fr}.choice{min-height:105px}.panel{padding:21px}.brand{font-size:20px}header{padding:20px 15px}input{width:100%;display:block}.answerline{line-height:1.8}.clue{font-size:24px}th,td{min-width:100px}.actions button{flex:1;min-width:125px}}
</style></head><body><header><div class="brand">🔎 單字小偵探 <span class="small">WORD DETECTIVE</span></div><button id="home">⌂ 首頁</button></header><main id="app"></main><footer>Explore Our World 3 · Unit 1 & Unit 4 · 每輪隨機出題，不限時，可重試</footer><script>
'use strict';

['doctor','醫師','He helps sick people. He works in a hospital.','He is a','他幫助生病的人，在醫院工作。'],
['firefighter','消防員','She puts out fires. She rides in a fire truck.','She is a','她撲滅火災，乘坐消防車。'],

['vet','獸醫','She helps sick dogs and cats.','She is a','她幫助生病的狗和貓。'],
['rock star','搖滾歌星','He sings rock songs. He plays the guitar on stage.','He is a','他唱搖滾歌曲，在舞台上彈吉他。'],
['movie star','電影明星','She acts in movies. Many people watch her movies.','She is a','她演電影，很多人看她的電影。'],
['inventor','發明家','He has new ideas. He makes new things that help people.','He is an','他有新點子，發明幫助人們的新東西。'],
['artist','藝術家','She draws and paints beautiful pictures.','She is an','她畫出美麗的圖畫。'],
['soccer player','足球員','He plays soccer. He kicks a ball into a goal.','He is a','他踢足球，把球踢進球門。'],
['school','學校','Children learn here. Teachers teach here.','This place is a','孩子在這裡學習，老師在這裡教書。'],

['hospital','醫院','Sick people come here. Doctors and nurses help them.','This place is a','生病的人來這裡，醫師和護理師幫助他們。'],

['farm','農場','Cows and chickens live here. A farmer grows rice here, too.','This place is a','這裡有牛和雞，農夫也在這裡種稻米。'],

],u4:[

['bakery','麵包店','You can buy bread and cakes here. People make fresh bread here.','This place is a','你能在這裡買麵包和蛋糕，人們在這裡製作新鮮麵包。'],

['train station','火車站','You buy a train ticket here. You get on a train here.','This place is a','你在這裡買火車票、搭火車。'],

['museum','博物館','You can see very old things here. You learn about life long ago.','This place is a','你能在這裡看古老的物品，認識很久以前的生活。'],
['movie theater','電影院','You sit in a dark room. You watch a movie on a very big screen.','This place is a','你坐在暗暗的房間，在大螢幕上看電影。'],

['zoo','動物園','You can see lions, monkeys, and giraffes here. People take care of these animals.','This place is a','你能在這裡看獅子、猴子和長頸鹿，有人照顧這些動物。'],

const items=Object.entries(data).flatMap(([u,rows])=>rows.map(([word,zh,clue,prefix,translation],i)=>({id:u+'-'+i,u,word,zh,clue,prefix,translation,suffix:word==='on the corner of'?' First Avenue and Second Street.':word==='next to'?' the park.':word==='across from'?' the park.':'.'})));
const app=document.getElementById('app'),$=s=>document.querySelector(s);let queue=[],index=0,selection='u1',records=[],attempts=0,assisted=false,done=false,answerShown=false,firstEntry='',sound=true;
function shuffle(a,rng=Math.random){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(rng()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function normalize(s){return s.normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?。！？]/g,'').replace(/\s+/g,' ').trim()}
function accepts(s,q){let n=normalize(s);return n===q.word||(q.u==='u4'&&data.u4.findIndex(x=>x[0]===q.word)<16&&n.replace(/^(a|an|the) /,'')===q.word)}
function speak(s){if(!sound)return;if(!('speechSynthesis'in window)){feedback('此裝置不支援發音，仍可繼續練習。');return}speechSynthesis.cancel();let t=new SpeechSynthesisUtterance(s);t.lang='en-US';t.rate=.78;speechSynthesis.speak(t)}
function feedback(s){if($('#feedback'))$('#feedback').textContent=s}
function home(){if('speechSynthesis'in window)speechSynthesis.cancel();app.innerHTML='<section class="hero"><div class="eyebrow">READ · THINK · WRITE</div><h1>讀線索，找出單字！</h1><p class="muted">讀一讀簡單英文，當個單字小偵探。<br>把答案寫進空格，試試看你能解開幾個謎題。</p></section><section class="panel"><h2>選擇今天的任務</h2><div class="choices"><button class="choice" data-start="u1"><b>👩‍🌾 Unit 1</b><span>The World of Work</span><small>職業與工作場所 · 19 題</small></button><button class="choice" data-start="u4"><b>🏙️ Unit 4</b><span>My Place in the World</span><small>城市地點與方位片語 · 19 題</small></button><button class="choice" data-start="both"><b>🧭 兩課混合</b><span>Mixed Challenge</span><small>完整練習 · 38 題</small></button></div><p class="small">每輪隨機排列，全部題目都會出現。地點答案前面的 a 已放在句子裡，填單字即可。<br>先自己作答，需要時再使用中文、字首提示或單字庫。使用提示的題目也能再次練習。</p><details><summary>教師題庫：查看全部 38 題與答案</summary>'+teacherTable()+'</details></section>';document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start))}
function start(s,subset){selection=s;queue=shuffle(subset||items.filter(q=>s==='both'||q.u===s));index=0;records=[];question()}
function bank(){return [...new Set(queue.map(q=>q.word))].sort()}
function question(){attempts=0;assisted=false;done=false;answerShown=false;firstEntry='';let q=queue[index];app.innerHTML='<section class="panel"><div class="top"><span class="badge">'+(q.u==='u1'?'Unit 1 · The World of Work':'Unit 4 · My Place in the World')+'</span><span>'+(index+1)+' / '+queue.length+'</span></div><div class="track"><div class="bar" style="width:'+(index/queue.length*100)+'%"></div></div><div class="eyebrow">READ THE CLUE</div><p class="clue">'+q.clue+'</p><form id="answerform"><div class="answerline"><label for="answer">'+q.prefix+' </label><input id="answer" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="填入單字或片語" placeholder="Type your answer"><span>'+q.suffix+'</span></div><div class="actions"><button class="primary" type="submit" id="check">✓ 檢查答案</button><button type="button" id="listen">🔊 聽英文線索</button></div></form><div id="feedback" class="feedback" aria-live="polite">讀完線索，再輸入你的答案。</div><div class="actions"><button id="chinese">中文線索</button><button id="hintbtn">字首提示</button><button id="bankbtn">查看單字庫</button><button id="reveal">看看答案</button></div><div id="hint" class="hint" aria-live="polite"></div><div id="bank" class="wordbank"></div><div id="nextarea"></div><p class="small">大小寫、多餘空格與句尾標點不影響判分。請填完整單字或片語。</p></section>';$('#answerform').onsubmit=e=>{e.preventDefault();check()};$('#listen').onclick=()=>speak(q.clue);$('#chinese').onclick=()=>{if(!done)assisted=true;$('#hint').textContent=q.translation};$('#hintbtn').onclick=()=>{if(!done)assisted=true;$('#hint').textContent=q.word.split(' ').map(w=>w[0]+' _'.repeat(w.length-1)).join('  /  ')+'（共 '+q.word.split(' ').length+' 個字，'+q.word.replaceAll(' ','').length+' 個字母）'};$('#bankbtn').onclick=()=>{if(!done)assisted=true;$('#bank').innerHTML=bank().map(w=>'<span>'+w+'</span>').join('')};$('#reveal').onclick=()=>{if(done)return;assisted=true;answerShown=true;$('#hint').textContent='答案：'+q.word+'（'+q.zh+'）';feedback('讀一遍，再把答案輸入空格，幫助自己記住。');speak(q.word)};$('#answer').focus()}
function check(){if(done)return;let q=queue[index],value=$('#answer').value;if(!normalize(value)){feedback('請先輸入一個單字或片語。');$('#answer').focus();return}attempts++;if(attempts===1)firstEntry=value;if(!accepts(value,q)){feedback('再試一次！注意線索的意思，也檢查拼字和空格。');$('#answer').focus();return}done=true;records.push({q,attempts,assisted,answerShown,firstEntry});$('#answer').disabled=true;$('#check').disabled=true;feedback('✅ 答對了！ '+q.word+' · '+q.zh);speak(q.word);$('#nextarea').innerHTML='<button id="next" class="primary">'+(index===queue.length-1?'看我的成果 ✨':'下一題 →')+'</button>';$('#next').onclick=()=>{index++;if(index===queue.length)finish();else question()};$('#next').focus()}
function finish(){let independent=records.filter(r=>r.attempts===1&&!r.assisted).length,review=records.filter(r=>r.attempts>1||r.assisted).map(r=>r.q);app.innerHTML='<section class="panel"><div class="center"><div style="font-size:65px">🏅</div><h1>任務完成！</h1><p class="muted">每一題都練習到了，你很努力！</p><div class="results"><div class="stat"><b>'+records.length+'</b>完成題數</div><div class="stat"><b>'+independent+'</b>獨立一次答對</div><div class="stat"><b>'+review.length+'</b>值得再練習</div></div><div class="actions" style="justify-content:center"><button id="retry" class="primary" '+(!review.length?'disabled':'')+'>錯題與提示題重練</button><button id="again">全部重新洗牌</button><button id="back">回首頁</button></div></div><h2>我的練習紀錄</h2><div class="tablewrap"><table><thead><tr><th>單元</th><th>答案</th><th>練習情況</th></tr></thead><tbody>'+records.map(r=>'<tr><td>'+r.q.u.toUpperCase()+'</td><td><b>'+r.q.word+'</b><br>'+r.q.zh+'</td><td>'+(r.assisted?'💡 使用提示':r.attempts===1?'✅ 獨立一次答對':'🌱 重試後答對')+'<br>作答 '+r.attempts+' 次</td></tr>').join('')+'</tbody></table></div><p class="small">「值得再練習」包含曾答錯或使用中文、字首、單字庫、答案提示的題目。</p></section>';$('#retry').onclick=()=>start(selection,review);$('#again').onclick=()=>start(selection);$('#back').onclick=home}
function teacherTable(){return '<div class="tablewrap"><table><thead><tr><th>單元</th><th>英文線索與填空</th><th>答案</th></tr></thead><tbody>'+items.map(q=>'<tr><td>'+q.u.toUpperCase()+'</td><td>'+q.clue+'<br>'+q.prefix+' ________'+q.suffix+'</td><td><b>'+q.word+'</b><br>'+q.zh+'</td></tr>').join('')+'</tbody></table></div>'}
document.getElementById('home').onclick=()=>{if(!queue.length||index>=queue.length||confirm('要回首頁嗎？這一輪的作答紀錄將不保留。')){queue=[];home()}};home();
</script></body></html>
